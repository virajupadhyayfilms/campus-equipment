<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
<rect width="1100" height="780" fill="#f5f8f8"/><style>text{font-family:Arial,sans-serif;fill:#193640}.title{font-size:25px;font-weight:bold}.head{fill:white;font-size:17px;font-weight:bold}.body{font-size:14px}.card{fill:white;stroke:#b6ccca;stroke-width:1.5}.link{fill:none;stroke:#327d6b;stroke-width:2}.label{font-size:13px;fill:#166957}</style>
<text x="45" y="48" class="title">Campus Equipment — Relational ER Diagram</text><text x="45" y="75" class="body">PK: primary key · FK: foreign key · 1 : N: one-to-many relationship</text>
<path class="link" d="M300 240H410M690 245H790M930 285V335"/>
<text x="315" y="230" class="label">1 : N</text><text x="720" y="233" class="label">N : 1</text><text x="945" y="315" class="label">N : 1</text>
<rect x="45" y="140" width="255" height="215" rx="8" class="card"/><path d="M45 148Q45 140 53 140H292Q300 140 300 148V180H45Z" fill="#166957"/><text x="63" y="167" class="head">STUDENTS</text>
<text x="63" y="210" class="body"><tspan x="63">PK student_id</tspan><tspan x="63" dy="26">roll_number (UNIQUE)</tspan><tspan x="63" dy="26">student_name</tspan><tspan x="63" dy="26">department</tspan><tspan x="63" dy="26">email (UNIQUE)</tspan></text>
<rect x="410" y="140" width="280" height="245" rx="8" class="card"/><path d="M410 148Q410 140 418 140H682Q690 140 690 148V180H410Z" fill="#166957"/><text x="428" y="167" class="head">LOANS</text>
<text x="428" y="210" class="body"><tspan x="428">PK loan_id</tspan><tspan x="428" dy="26">FK student_id → students</tspan><tspan x="428" dy="26">FK equipment_id → equipment</tspan><tspan x="428" dy="26">issue_date</tspan><tspan x="428" dy="26">due_date</tspan><tspan x="428" dy="26">return_date (NULL if open)</tspan><tspan x="428" dy="26">notes</tspan></text>
<rect x="790" y="140" width="265" height="145" rx="8" class="card"/><path d="M790 148Q790 140 798 140H1047Q1055 140 1055 148V180H790Z" fill="#166957"/><text x="808" y="167" class="head">EQUIPMENT</text>
<text x="808" y="207" class="body"><tspan x="808">PK equipment_id</tspan><tspan x="808" dy="22">asset_code (UNIQUE)</tspan><tspan x="808" dy="22">equipment_name</tspan><tspan x="808" dy="22">FK category_id; condition</tspan></text>
<rect x="790" y="335" width="265" height="125" rx="8" class="card"/><path d="M790 343Q790 335 798 335H1047Q1055 335 1055 343V375H790Z" fill="#166957"/><text x="808" y="362" class="head">CATEGORIES</text><text x="808" y="405" class="body">PK category_id</text><text x="808" y="432" class="body">category_name (UNIQUE)</text>
<path d="M550 385V475" class="link"/><text x="564" y="441" class="label">1 : N</text>
<rect x="410" y="475" width="280" height="170" rx="8" class="card"/><path d="M410 483Q410 475 418 475H682Q690 475 690 483V515H410Z" fill="#166957"/><text x="428" y="502" class="head">LOAN_EVENTS</text><text x="428" y="546" class="body"><tspan x="428">PK event_id</tspan><tspan x="428" dy="26">FK loan_id → loans</tspan><tspan x="428" dy="26">event_type</tspan><tspan x="428" dy="26">recorded_at</tspan></text>
<rect x="45" y="685" width="1010" height="60" rx="8" fill="#e4eee9"/><text x="64" y="710" class="body">Business rule: each equipment item can have many historical loans, but only one open loan.</text><text x="64" y="733" class="body">Availability and overdue status are derived. A trigger records issue and return events.</text></svg>
